
name: Build DUNE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract DUNE
        run: unzip -q DUNE_Android_Starter_with_APK_Build.zip

      - name: Build APK
        run: cd DUNE_Android_Starter && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DUNE-APK
          path: DUNE_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
          
